plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Load release signing config. Priority:
//   1. android/key.properties (local builds)
//   2. environment variables (CI / GitHub Actions)
// If neither is present, release builds fall back to the debug key.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def resolveSigning = { String propKey, String envKey ->
    return keystoreProperties.getProperty(propKey) ?: System.getenv(envKey)
}

def ksStoreFile = resolveSigning("storeFile", "KEYSTORE_FILE")
def ksStorePassword = resolveSigning("storePassword", "KEYSTORE_PASSWORD")
def ksKeyAlias = resolveSigning("keyAlias", "KEY_ALIAS")
def ksKeyPassword = resolveSigning("keyPassword", "KEY_PASSWORD")
def hasReleaseSigning = ksStoreFile != null && file(ksStoreFile).exists()

android {
    namespace = "com.mahyac.flappy_dash"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.mahyac.flappy_dash"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile = file(ksStoreFile)
                storePassword = ksStorePassword
                keyAlias = ksKeyAlias
                keyPassword = ksKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // Use the persistent release key when available; otherwise fall back
            // to the debug key so contributors can still build locally.
            signingConfig = hasReleaseSigning
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
